<!DOCTYPE html>
<html lang="fr" data-theme="glass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maily</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="sun"></div>
    <div class="bokeh b1"></div>
    <div class="bokeh b2"></div>
    <div class="bokeh b3"></div>
    <div class="hill"></div>
  </div>

  <div class="win">
    <header class="top">
      <input id="search" class="search" type="search" placeholder="Rechercher dans les mails…" autocomplete="off">
      <button id="themebtn" class="ghost" title="Changer de thème (Frutiger Aero / DedSec)">Thème</button>
      <button id="compose" class="gel">Écrire</button>
    </header>

    <div class="dedsec-term" aria-hidden="true">root@dedsec:~$ MAIL_SYS <span class="ok">// ONLINE</span> [ x_x ]<span class="caret"></span></div>

    <div class="body" id="appbody">
      <nav class="rail" id="rail" aria-label="Comptes et dossiers"></nav>
      <section class="listcol">
        <div class="listbar">
          <button id="sync" class="ghost" title="Synchroniser">Synchroniser</button>
          <button id="markread" class="ghost" title="Tout marquer comme lu">Tout marquer lu</button>
          <span class="listbar-title" id="listbar-title"></span>
        </div>
        <div class="cats" id="cats"></div>
        <div class="list" id="list" aria-label="Messages"></div>
      </section>
      <section class="read" id="read" aria-label="Lecture">
        <div class="read-empty">Sélectionne un message pour le lire.</div>
      </section>
    </div>
  </div>

  <div class="modal-backdrop" id="composer" hidden>
    <div class="composer">
      <div class="composer-head">
        <span id="composer-title">Nouveau message</span>
        <button class="icon-btn" id="c-close" title="Fermer"></button>
      </div>
      <div class="composer-body">
        <label class="c-row"><span class="c-lbl">De</span><select id="c-from"></select></label>
        <label class="c-row"><span class="c-lbl">À</span><input id="c-to" placeholder="destinataires, séparés par des virgules"></label>
        <label class="c-row"><span class="c-lbl">Cc</span><input id="c-cc" placeholder="optionnel"></label>
        <label class="c-row"><span class="c-lbl">Objet</span><input id="c-subject" placeholder="objet du message"></label>
        <textarea id="c-body" placeholder="Votre message…"></textarea>
        <div class="c-atts" id="c-atts"></div>
        <input type="file" id="c-file" multiple hidden>
      </div>
      <div class="composer-foot">
        <button class="gel" id="c-send">Envoyer</button>
        <button class="ghost" id="c-attach">Joindre</button>
        <button class="ghost" id="c-cancel">Annuler</button>
        <span id="c-status" class="c-status"></span>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="thememodal" hidden>
    <div class="thememenu">
      <div class="composer-head thememenu-head">
        <span>Choisir un thème</span>
        <button class="icon-btn" id="theme-close" title="Fermer"></button>
      </div>
      <div class="theme-opts">
        <button class="theme-opt" data-theme-val="aero"><span class="sw sw-aero"></span> Frutiger Aero</button>
        <button class="theme-opt" data-theme-val="glass"><span class="sw sw-glass"></span> Glassmorphisme</button>
        <button class="theme-opt" data-theme-val="dedsec"><span class="sw sw-dedsec"></span> DedSec</button>
      </div>
      <div class="glass-ctl">
        <div class="glass-ctl-top"><span>Densité du fond (Verre)</span><span class="glass-ctl-val" id="glass-alpha-val">60%</span></div>
        <input type="range" id="glass-alpha" class="glass-slider" min="0" max="100" value="60"
               title="Opacité / clarté du dépoli en thème Verre">
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
