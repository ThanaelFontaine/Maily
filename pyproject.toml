[project]
name = "maily"
version = "0.6.0"
description = "Local, multi-account email client for Gmail and IMAP: your mail stays on your computer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thanaël Fontaine" }]
keywords = ["email", "gmail", "imap", "desktop", "local-first", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email :: Email Clients (MUA)",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.5",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
    "keyring>=25.4",
    "cryptography>=43",
    "nh3>=0.2.18",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pywebview>=5.2",
    "pyobjc-framework-LocalAuthentication>=10.0 ; sys_platform == 'darwin'",
    # Serveur MCP (app/mcp_server.py). En dependance principale (pas un groupe
    # optionnel) pour eviter le va-et-vient d'installation qui corrompait l'env
    # quand Claude Code lançait `uv run` (jsonschema est une dep de mcp, epinglee
    # explicitement pour fiabiliser la resolution).
    "mcp>=1.2,<2",
    "jsonschema>=4.20",
]

[project.urls]
Homepage = "https://github.com/ThanaelFontaine/fetch-multi-mail-viewer-sender"
Documentation = "https://github.com/ThanaelFontaine/fetch-multi-mail-viewer-sender#readme"
Changelog = "https://github.com/ThanaelFontaine/fetch-multi-mail-viewer-sender/blob/main/CHANGELOG.md"
Issues = "https://github.com/ThanaelFontaine/fetch-multi-mail-viewer-sender/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
build = [
    "pyinstaller>=6.10",
    "pillow>=10.0",
]

[tool.setuptools]
packages = ["core", "api", "app"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
