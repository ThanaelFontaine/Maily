[project]
name = "maily"
version = "0.1.0"
description = "Outil email local multi-comptes (viewer + sender)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.5",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
    "keyring>=25.4",
    "nh3>=0.2.18",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pywebview>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
build = [
    "pyinstaller>=6.10",
    "pillow>=10.0",
]

[tool.setuptools]
packages = ["core", "api", "app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
