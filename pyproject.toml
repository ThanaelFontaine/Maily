[project]
name = "maily"
version = "0.1.0"
description = "Outil email local multi-comptes (viewer + sender)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.setuptools]
packages = ["core"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
