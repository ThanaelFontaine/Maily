# Dependency and action updates, one pull request a month at most per group.
# Nothing merges by itself: each update goes through the same review and
# checks as any change. Major versions come in their own pull request.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      uv:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
