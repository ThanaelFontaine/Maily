# Maily tests on macOS and Linux: on every push to main and every pull request
# (a PR triggers a single run; a pushed tag triggers none).
# The tests use no network, no real mailbox and not the real data folder:
# tests/conftest.py imposes a temporary folder and a null keyring.
# Windows is not in the matrix: the code has fallbacks (msvcrt lock, %APPDATA%
# folder), but several tests check POSIX permissions (0600/0700) and have no
# Windows equivalent yet.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Python 3.12
        run: uv python install 3.12

      - name: Dependencies (uv.lock must be up to date)
        run: uv sync --locked

      - name: Tests
        run: uv run pytest
