# Maily tests on macOS and Linux, and the text check (scripts/check_text.py):
# on every push to main and every pull request
# (a PR triggers a single run; a pushed tag triggers none).
# The tests use no network, no real mailbox and not the real data folder:
# tests/conftest.py imposes a temporary folder and a null keyring.
# Windows is not in the matrix: the code has fallbacks (msvcrt lock, %APPDATA%
# folder), but several tests check POSIX permissions (0600/0700) and have no
# Windows equivalent yet.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Python 3.12
        run: uv python install 3.12

      - name: Dependencies (uv.lock must be up to date)
        run: uv sync --locked

      - name: Tests
        run: uv run pytest

  text:
    name: check-text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: No em or en dash, no private path or address
        run: python3 scripts/check_text.py
