# Tests de Maily sur macOS et Linux : a chaque push sur main et a chaque pull
# request (une PR ne declenche qu'un seul run ; un tag pousse n'en declenche aucun).
# Les tests n'utilisent ni le reseau, ni une vraie boite, ni le vrai dossier de
# donnees : tests/conftest.py impose un dossier temporaire et un keyring nul.
# Windows n'est pas dans la matrice : le code prevoit des replis (verrou msvcrt,
# dossier %APPDATA%), mais plusieurs tests verifient des permissions POSIX
# (0600/0700) et n'ont pas encore d'equivalent Windows.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Python 3.12
        run: uv python install 3.12

      - name: Dependances (uv.lock a jour obligatoire)
        run: uv sync --locked

      - name: Tests
        run: uv run pytest
