# Chaque version porte sa release GitHub, creee par la CI en meme temps que le
# tag, avec des notes qui disent ce qui change.
#
# Declenchement : apres un passage VERT du workflow « Tests » sur un push de
# main. Si la version de pyproject.toml n'a pas encore de tag vX.Y.Z, le tag et
# la release sont crees ; les notes sont la section « ## [X.Y.Z] » de
# CHANGELOG.md (la release echoue si cette section manque ou est vide). Une
# version deja taguee ne fait rien. Ne jamais creer de tag ni de release a la main.

name: Release

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Version et tag
        id: ver
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version de pyproject.toml invalide : $VERSION (attendu X.Y.Z)." >&2
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Le tag $TAG existe deja : rien a publier."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notes depuis CHANGELOG.md
        if: steps.ver.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md n'a pas de section non vide pour $VERSION." >&2
            exit 1
          fi
          cat release-notes.md

      - name: Tag et release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Maily $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "Maily $TAG" --notes-file release-notes.md --verify-tag
