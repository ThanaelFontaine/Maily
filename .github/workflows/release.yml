# Every version has its GitHub release, created by the CI together with the
# tag, with notes that say what changes, and with the macOS, Windows and Linux
# apps attached.
#
# Trigger: after a GREEN run of the "Tests" workflow on a push to main.
#
# 1. plan:    reads the version in pyproject.toml and its "## [X.Y.Z]" section
#             of CHANGELOG.md (fails if it is missing or empty). If release
#             vX.Y.Z is already published with all its files
#             (scripts/release_notes.py assets), there is nothing to do and the
#             next jobs are skipped.
# 2. build:   build.yml on the tested commit: the macOS disk image, the Windows
#             zip and the Linux archive, each with its SHA-256 file, each binary
#             checked by running it. Nothing is published here.
# 3. publish: only once EVERY build succeeded: creates the vX.Y.Z tag, then a
#             DRAFT release with all the files, then publishes it. A release is
#             therefore never visible without its downloads.
#
# Re-running the workflow resumes safely: an existing tag on the same commit is
# reused, an unpublished draft left by an interrupted run is replaced, and a
# published release that lacks a file only gets the missing ones. The build and
# publish jobs recompute the version themselves; they are only skipped when
# plan says explicitly that everything is already published.
#
# The whole chain starts from this workflow because events created with
# GITHUB_TOKEN (the tag, the release) do not start other workflows.
# Never create a tag or a release by hand.

name: Release

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Version, notes and release state
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 scripts/release_notes.py version)"
          TAG="v$VERSION"
          python3 scripts/release_notes.py notes "$VERSION"
          # Asset names of the PUBLISHED release, if there is one.
          HAVE="$(gh release view "$TAG" --json isDraft,assets --jq 'select(.isDraft | not) | .assets[].name' 2>/dev/null || true)"
          ASSETS="$(python3 scripts/release_notes.py assets "$VERSION")"
          [ -n "$ASSETS" ] || { echo "No release file names." >&2; exit 1; }
          MISSING=0
          while read -r f; do
            grep -qxF "$f" <<< "$HAVE" || MISSING=1
          done <<< "$ASSETS"
          if [ "$MISSING" -eq 0 ]; then
            echo "Release $TAG is already published with all its files: nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: ${{ needs.plan.outputs.needed != 'false' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}

  publish:
    needs: [plan, build]
    if: ${{ needs.plan.outputs.needed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: maily-*
          merge-multiple: true
          path: release-assets

      - name: Tag, draft release with all the files, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION="$(python3 scripts/release_notes.py version)"
          TAG="v$VERSION"
          # Every expected file is there, and every build matches its checksum.
          ASSETS="$(python3 scripts/release_notes.py assets "$VERSION")"
          mapfile -t FILES <<< "$ASSETS"
          [ "${#FILES[@]}" -ge 6 ] || { echo "Unexpected release file list: $ASSETS" >&2; exit 1; }
          for f in "${FILES[@]}"; do
            [ -f "release-assets/$f" ] || { echo "Missing build file: $f" >&2; exit 1; }
            case "$f" in
              *.sha256) (cd release-assets && shasum -a 256 -c "$f") ;;
            esac
          done
          python3 scripts/release_notes.py notes "$VERSION" > release-notes.md

          # Releases already attached to this tag (drafts are listed too: the
          # token has push access).
          RELEASES="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
                        --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")"
          PUBLISHED=""
          while read -r ID DRAFT; do
            [ -n "$ID" ] || continue
            if [ "$DRAFT" = "true" ]; then
              echo "Replacing the unpublished draft $ID left by an interrupted run."
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID"
            else
              PUBLISHED="$ID"
            fi
          done <<< "$RELEASES"

          # The tag: created on the tested commit, or reused if a previous
          # attempt already pushed it there.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-list -n 1 "$TAG")" != "$HEAD_SHA" ]; then
              echo "Tag $TAG already exists on another commit." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Maily $TAG" "$HEAD_SHA"
            git push origin "$TAG"
          fi

          if [ -n "$PUBLISHED" ]; then
            # Published earlier without its files: add the missing ones only.
            HAVE="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for f in "${FILES[@]}"; do
              grep -qxF "$f" <<< "$HAVE" || gh release upload "$TAG" "release-assets/$f"
            done
          else
            gh release create "$TAG" "${FILES[@]/#/release-assets/}" \
              --draft --verify-tag --title "Maily $TAG" --notes-file release-notes.md
            gh release edit "$TAG" --draft=false
          fi
