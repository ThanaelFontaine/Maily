name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Maily-linux-x64
          - os: windows-latest
            artifact: Maily-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système Linux (GTK / WebKit pour pywebview)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: uv sync --group build

      - name: Binding GTK (Linux)
        if: runner.os == 'Linux'
        # PyGObject >=3.52 exige girepository-2.0 (absent d'Ubuntu 24.04) : on pin
        # la derniere serie compatible girepository-1.0.
        run: uv pip install pycairo "pygobject==3.50.0"

      - name: Build PyInstaller
        run: uv run pyinstaller packaging/maily.spec --noconfirm

      - name: Empaqueter (Linux)
        if: runner.os == 'Linux'
        run: cd dist && tar czf "../${{ matrix.artifact }}.tar.gz" Maily

      - name: Empaqueter (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Maily -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Attacher à la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          fail_on_unmatched_files: false
